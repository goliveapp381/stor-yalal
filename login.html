<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | TemplateCraft Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: 'Cairo', sans-serif;
        }

        .animated-mesh-bg {
            background:
                linear-gradient(
                    -45deg,
                    #0f172a,
                    #2e1065,
                    #4c1d95,
                    #3b0764
                );

            background-size: 400% 400%;

            animation: waveGradient 12s ease infinite;
        }

        @keyframes waveGradient {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

    </style>

</head>


<body class="animated-mesh-bg min-h-screen flex items-center justify-center p-4">


<div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 relative">


    <!-- العودة -->

    <a
        href="index.html"
        class="absolute top-4 left-4 text-gray-400 hover:text-purple-600 text-sm font-bold"
    >
        الرئيسية ➔
    </a>


    <!-- العنوان -->

    <div class="text-center mb-8">

        <h1 class="text-2xl font-bold text-purple-600 mb-1">
            TemplateCraft Pro
        </h1>

        <p
            id="page-subtitle"
            class="text-gray-500 text-sm"
        >
            سجل دخولك لإدارة مشاريعك وقوالبك الرقمية
        </p>

    </div>


    <!-- Form -->

    <form
        id="login-form"
        class="space-y-4"
    >


        <!-- Username -->

        <div
            id="name-container"
            class="hidden"
        >

            <label class="block text-sm font-bold text-gray-700 mb-1">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50"
                placeholder="أدخل اسمك"
            >

        </div>


        <!-- Email -->

        <div>

            <label class="block text-sm font-bold text-gray-700 mb-1">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50"
                placeholder="name@example.com"
            >

        </div>


        <!-- Password -->

        <div>

            <label class="block text-sm font-bold text-gray-700 mb-1">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                required
                minlength="6"
                autocomplete="current-password"
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50"
                placeholder="••••••••"
            >

        </div>


        <!-- Button -->

        <button
            type="submit"
            id="submit-btn"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
            تسجيل الدخول
        </button>


    </form>


    <!-- Toggle -->

    <div class="mt-6 text-center text-sm border-t pt-4">

        <span
            id="toggle-text"
            class="text-gray-500"
        >
            ليس لديك حساب؟
        </span>

        <button
            type="button"
            id="toggle-button"
            class="text-purple-600 font-bold mr-1 hover:underline"
        >
            إنشاء حساب جديد
        </button>

    </div>


    <!-- Status -->

    <div
        id="message"
        role="status"
        aria-live="polite"
        class="mt-5 text-center text-sm font-semibold"
    ></div>


</div>


<script src="./client-api.js"></script>


<script>

    // ==========================================
    // 1. STATE
    // ==========================================

    let isSignup = false;


    // ==========================================
    // 2. ELEMENTS
    // ==========================================

    const form =
        document.getElementById('login-form');

    const nameContainer =
        document.getElementById('name-container');

    const usernameInput =
        document.getElementById('username');

    const emailInput =
        document.getElementById('email');

    const passwordInput =
        document.getElementById('password');

    const submitButton =
        document.getElementById('submit-btn');

    const toggleButton =
        document.getElementById('toggle-button');

    const toggleText =
        document.getElementById('toggle-text');

    const subtitle =
        document.getElementById('page-subtitle');

    const message =
        document.getElementById('message');


    // ==========================================
    // 3. MESSAGE HELPER
    // ==========================================

    function showMessage(text, type = 'error') {

        message.textContent = text;

        message.className =
            'mt-5 text-center text-sm font-semibold';

        if (type === 'success') {

            message.classList.add('text-green-600');

        } else if (type === 'info') {

            message.classList.add('text-blue-600');

        } else {

            message.classList.add('text-red-600');

        }

    }


    // ==========================================
    // 4. TOGGLE LOGIN / SIGNUP
    // ==========================================

    toggleButton.addEventListener('click', () => {

        isSignup = !isSignup;

        message.textContent = '';

        if (isSignup) {

            subtitle.textContent =
                'أنشئ حساباً جديداً وابدأ رحلتك معنا';

            nameContainer.classList.remove('hidden');

            usernameInput.required = true;

            usernameInput.autocomplete = 'username';

            passwordInput.autocomplete = 'new-password';

            submitButton.textContent =
                'إنشاء الحساب';

            toggleText.textContent =
                'لديك حساب بالفعل؟';

            toggleButton.textContent =
                'تسجيل الدخول';

        } else {

            subtitle.textContent =
                'سجل دخولك لإدارة مشاريعك وقوالبك الرقمية';

            nameContainer.classList.add('hidden');

            usernameInput.required = false;

            passwordInput.autocomplete = 'current-password';

            submitButton.textContent =
                'تسجيل الدخول';

            toggleText.textContent =
                'ليس لديك حساب؟';

            toggleButton.textContent =
                'إنشاء حساب جديد';

        }

    });


    // ==========================================
    // 5. AUTHENTICATION RESPONSE VALIDATION
    // ==========================================

    function validateAuthResponse(result) {

        if (!result || !result.success) {

            throw new Error(
                result?.error ||
                result?.message ||
                'تعذر إتمام العملية'
            );

        }

        if (
            typeof result.token !== 'string' ||
            !result.token.trim()
        ) {

            throw new Error(
                'السيرفر لم يرجع رمز الدخول JWT. تأكد من إعداد api-routes.js.'
            );

        }

        if (
            !result.user ||
            typeof result.user !== 'object'
        ) {

            throw new Error(
                'السيرفر لم يرجع بيانات المستخدم بشكل صحيح.'
            );

        }

        const userId =
            result.user.id ||
            result.user._id;

        if (!userId) {

            throw new Error(
                'معرف المستخدم غير موجود في استجابة السيرفر.'
            );

        }

        return true;

    }


    // ==========================================
    // 6. SAVE AUTHENTICATION
    // ==========================================

    function saveAuthentication(result) {

        // Store JWT token.

        localStorage.setItem(
            'token',
            result.token
        );


        // Store user information.

        const userData = {
            ...result.user,

            id:
                result.user.id ||
                result.user._id
        };

        localStorage.setItem(
            'user',
            JSON.stringify(userData)
        );


        // Verify that storage succeeded.

        if (
            localStorage.getItem('token') !== result.token ||
            !localStorage.getItem('user')
        ) {

            localStorage.removeItem('token');
            localStorage.removeItem('user');

            throw new Error(
                'تعذر حفظ بيانات تسجيل الدخول في المتصفح.'
            );

        }

    }


    // ==========================================
    // 7. FORM SUBMIT
    // ==========================================

    form.addEventListener('submit', async (event) => {

        event.preventDefault();


        if (submitButton.disabled) {
            return;
        }


        const email =
            emailInput.value.trim().toLowerCase();

        const password =
            passwordInput.value;


        const username =
            usernameInput.value.trim();


        if (!email || !password) {

            showMessage(
                'يرجى إدخال البريد الإلكتروني وكلمة المرور.'
            );

            return;

        }


        if (isSignup && !username) {

            showMessage(
                '⚠️ أدخل اسم المستخدم.'
            );

            usernameInput.focus();

            return;

        }


        // Disable button.

        submitButton.disabled = true;

        submitButton.textContent =
            '⏳ جاري الاتصال...';


        showMessage(
            'جاري الاتصال بالسيرفر...',
            'info'
        );


        try {

            // Make sure API client exists.

            if (
                typeof TemplateCraftAPI === 'undefined'
            ) {

                throw new Error(
                    'ملف client-api.js غير متوفر أو لم يتم تحميله.'
                );

            }


            let result;


            // ==========================================
            // SIGNUP
            // ==========================================

            if (isSignup) {

                result = await TemplateCraftAPI.signup({

                    username: username,

                    email: email,

                    password: password

                });

            }


            // ==========================================
            // LOGIN
            // ==========================================

            else {

                result = await TemplateCraftAPI.login({

                    email: email,

                    password: password

                });

            }


            // ==========================================
            // VALIDATE RESPONSE
            // ==========================================

            validateAuthResponse(result);


            // ==========================================
            // SAVE JWT + USER
            // ==========================================

            saveAuthentication(result);


            // ==========================================
            // SUCCESS
            // ==========================================

            showMessage(
                '✅ ' +
                (
                    result.message ||
                    (isSignup
                        ? 'تم إنشاء الحساب بنجاح'
                        : 'تم تسجيل الدخول بنجاح')
                ),
                'success'
            );


            submitButton.textContent =
                '✅ تم بنجاح';


            // Redirect to dashboard.

            setTimeout(() => {

                window.location.replace(
                    'profile.html'
                );

            }, 700);


        } catch (error) {

            console.error(
                'Authentication error:',
                error
            );


            // Do not leave an old or invalid token.

            localStorage.removeItem('token');

            localStorage.removeItem('user');


            showMessage(
                '❌ ' +
                (
                    error.message ||
                    'تعذر الاتصال بالسيرفر.'
                )
            );


        } finally {

            submitButton.disabled = false;

            submitButton.textContent =
                isSignup
                    ? 'إنشاء الحساب'
                    : 'تسجيل الدخول';

        }

    });


    // ==========================================
    // 8. INITIAL CHECK
    // ==========================================

    // If a previous valid session exists,
    // the dashboard can be opened directly.

    const existingToken =
        localStorage.getItem('token');

    const existingUser =
        localStorage.getItem('user');


    if (existingToken && existingUser) {

        try {

            const parsedUser =
                JSON.parse(existingUser);

            if (
                parsedUser &&
                typeof parsedUser === 'object'
            ) {

                window.location.replace(
                    'profile.html'
                );

            }

        } catch (error) {

            localStorage.removeItem('token');

            localStorage.removeItem('user');

        }

    }

</script>

</body>
</html>
