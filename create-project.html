<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء مشروع جديد | TemplateCraft Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .animated-mesh-bg {
      background: linear-gradient(-45deg, #0f172a, #2e1065, #4c1d95, #3b0764);
      background-size: 400% 400%;
      animation: waveGradient 12s ease infinite;
    }
    @keyframes waveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-purple-600">TemplateCraft Pro</h1>
      <a href="index.html" class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-4 py-2 rounded-xl text-sm font-bold transition">
        الرئيسية ➔
      </a>
    </div>
  </header>

  <!-- Form Section -->
  <main class="max-w-2xl mx-auto px-4 py-12 w-full flex-grow">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-bold text-gray-900">إنشاء مشروع جديد 🚀</h2>
        <p class="text-gray-500 text-sm mt-1">قم بملء البيانات أدناه لإطلاق مشروعك الرقمي الجديد</p>
      </div>

      <form id="create-project-form" onsubmit="handleCreateProject(event)" class="space-y-6">
        
        <!-- اسم المشروع -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">اسم المشروع (Site Name)</label>
          <input type="text" id="siteName" required class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50" placeholder="مثال: my-store-2026">
        </div>

        <!-- نوع المشروع -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">نوع المشروع</label>
          <select id="projectType" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50">
            <option value="ecommerce">متجر إلكتروني (E-commerce)</option>
            <option value="corporate">شركات وخدمات (Corporate)</option>
            <option value="restaurant">مطاعم وضيافة (Restaurant)</option>
            <option value="real-estate">عقارات (Real Estate)</option>
            <option value="blog">مدونة شخصية (Blog)</option>
          </select>
        </div>

        <!-- طريقة الإضافة (قالب جاهز أو كود HTML) -->
        <div class="border-t pt-6">
          <label class="block text-sm font-bold text-gray-700 mb-3">طريقة بناء المشروع</label>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="border rounded-xl p-4 cursor-pointer hover:border-purple-600 flex items-center gap-3 transition">
              <input type="radio" name="sourceType" value="template" checked onclick="toggleSource('template')" class="text-purple-600 focus:ring-purple-500">
              <div>
                <span class="block font-bold text-gray-800">قالب جاهز من المنصة</span>
                <span class="text-xs text-gray-500">اختر قالباً احترافياً جاهزاً</span>
              </div>
            </label>

            <label class="border rounded-xl p-4 cursor-pointer hover:border-purple-600 flex items-center gap-3 transition">
              <input type="radio" name="sourceType" value="code" onclick="toggleSource('code')" class="text-purple-600 focus:ring-purple-500">
              <div>
                <span class="block font-bold text-gray-800">إضافة ملف HTML / كود</span>
                <span class="text-xs text-gray-500">ارفع ملفك أو اكتب الكود يدوياً</span>
              </div>
            </label>
          </div>
        </div>

        <!-- حقل اختيار القالب -->
        <div id="template-section">
          <label class="block text-sm font-bold text-gray-700 mb-2">اختر القالب المناسب</label>
          <select id="templateId" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50">
            <option value="store-demo">قالب متجر ملابس عصري</option>
            <option value="company-demo">قالب شركة استشارات</option>
            <option value="restaurant-demo">قالب مطعم ومقاهي</option>
          </select>
        </div>

        <!-- حقل رفع ملف HTML (مخفي افتراضياً) -->
        <div id="code-section" class="hidden">
          <label class="block text-sm font-bold text-gray-700 mb-2">محتوى كود HTML أو ملف المشروع</label>
          <textarea id="htmlCode" rows="4" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50 font-mono text-sm" placeholder="<!DOCTYPE html>..."></textarea>
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-purple-600/30">
          إطلاق وحفظ المشروع 🚀
        </button>

      </form>

    </div>
  </main>

  <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
    جميع الحقوق محفوظة © 2026 - منصة TemplateCraft Pro
  </footer>

  <!-- استدعاء ملف الإنديكس المركزي للاتصال بالباكند -->
  <script src="./client-api.js"></script>
  <script>
    function toggleSource(type) {
      const templateSection = document.getElementById('template-section');
      const codeSection = document.getElementById('code-section');
      if (type === 'template') {
        templateSection.classList.remove('hidden');
        codeSection.classList.add('hidden');
      } else {
        templateSection.classList.add('hidden');
        codeSection.classList.remove('hidden');
      }
    }

    async function handleCreateProject(event) {
      event.preventDefault();
      
      const storedUser = localStorage.getItem('user');
      if (!storedUser) {
        alert('❌ يجب تسجيل الدخول أولاً!');
        window.location.href = 'login.html';
        return;
      }
      const user = JSON.parse(storedUser);

      const siteName = document.getElementById('siteName').value;
      const projectType = document.getElementById('projectType').value;
      const sourceType = document.querySelector('input[name="sourceType"]:checked').value;
      const templateId = sourceType === 'template' ? document.getElementById('templateId').value : 'custom-html';
      const variables = { projectType, sourceType, htmlCode: document.getElementById('htmlCode')?.value || '' };

      // استعمال دالة deploy من الـ client-api.js لحفظ المشروع في قاعدة البيانات
      const result = await TemplateCraftAPI.deploy({
        userId: user.id || user.username,
        siteName,
        templateId,
        variables
      });

      if (result.success) {
        alert('✅ ' + result.message);
        window.location.href = 'profile.html';
      } else {
        alert('❌ خطأ: ' + result.error);
      }
    }
  </script>

</body>
</html>
