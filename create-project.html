<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TemplateCraft Pro | إنشاء مشروع جديد</title>
    <!-- Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-indigo-600">🚀 إنشاء موقع جديد عبر TemplateCraft Pro</h1>

        <!-- خطوة 1: اسم الموقع -->
        <div class="mb-6">
            <label class="block font-semibold mb-2">اسم الموقع (رابط المشروع):</label>
            <input type="text" id="siteNameInput" placeholder="مثال: my-awesome-store" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- خطوة 2: اختيار الصنف (Category) -->
        <div class="mb-6">
            <label class="block font-semibold mb-2">اختر الصنف (Category):</label>
            <select id="projectTypeSelect" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="blogs">مدونات (Blogs)</option>
                <option value="corporate">شركات (Corporate)</option>
                <option value="ecommerce">متاجر إلكترونية (E-commerce)</option>
                <option value="real-estate">عقارات (Real Estate)</option>
                <option value="restaurant-demo">مطاعم (Restaurant)</option>
            </select>
        </div>

        <!-- خطوة 3: اختيار القالب (Template ID) -->
        <div class="mb-6">
            <label class="block font-semibold mb-2">اختر رقم القالب المفضل:</label>
            <div class="grid grid-cols-3 gap-4">
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-1">
                    <p class="font-bold">القالب 1</p>
                </div>
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-2">
                    <p class="font-bold">القالب 2</p>
                </div>
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-3">
                    <p class="font-bold">القالب 3</p>
                </div>
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-4">
                    <p class="font-bold">القالب 4</p>
                </div>
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-5">
                    <p class="font-bold">القالب 5</p>
                </div>
                <div class="template-card border-2 p-4 rounded-xl cursor-pointer text-center hover:border-indigo-500 transition" data-template="template-6">
                    <p class="font-bold">القالب 6</p>
                </div>
            </div>
        </div>

        <!-- زر الإطلاق -->
        <button id="deployBtn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 transition">
            إطلاق وتركيب المشروع 🚀
        </button>

        <!-- رسالة الحالة -->
        <div id="statusMessage" class="mt-4 text-center font-semibold"></div>
    </div>

    <!-- سكربت الربط مع الـ API -->
    <script>
        let selectedTemplateId = 'template-1'; // القالب الافتراضي

        // تفعيل اختيار القالب بالضغط عليه
        document.querySelectorAll('.template-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.template-card').forEach(c => c.classList.remove('border-indigo-600', 'bg-indigo-50'));
                card.classList.add('border-indigo-600', 'bg-indigo-50');
                selectedTemplateId = card.getAttribute('data-template');
            });
        });

        // عملية الإرسال عند النقر على زر الإطلاق
        document.getElementById('deployBtn').addEventListener('click', async () => {
            const siteName = document.getElementById('siteNameInput').value.trim();
            const projectType = document.getElementById('projectTypeSelect').value;
            const statusDiv = document.getElementById('statusMessage');

            // جلب الـ userId المخزن محلياً عند تسجيل الدخول
            const user = JSON.parse(localStorage.getItem('user')) || {};
            const userId = user.id || localStorage.getItem('userId');

            if (!siteName) {
                statusDiv.className = "mt-4 text-center font-semibold text-red-600";
                statusDiv.innerText = "⚠️ عذراً، يجب إدخال اسم المشروع أولاً!";
                return;
            }

            if (!userId) {
                statusDiv.className = "mt-4 text-center font-semibold text-red-600";
                statusDiv.innerText = "⚠️ يرجى تسجيل الدخول أولاً لإطلاق المشروع.";
                return;
            }

            statusDiv.className = "mt-4 text-center font-semibold text-blue-600";
            statusDiv.innerText = "⏳ جاري إنشاء وإطلاق موقعك، يرجى الانتظار...";

            try {
                const response = await fetch('/api/deploy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        siteName: siteName,
                        templateId: selectedTemplateId,
                        variables: { projectType: projectType }
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = "mt-4 text-center font-semibold text-green-600";
                    statusDiv.innerHTML = `✅ تم إطلاق الموقع بنجاح! <br><a href="${data.url}" target="_blank" class="underline text-indigo-700">اضغط هنا لزيارة موقعك الحي 🌐</a>`;
                } else {
                    statusDiv.className = "mt-4 text-center font-semibold text-red-600";
                    statusDiv.innerText = "❌ خطأ: " + data.error;
                }
            } catch (err) {
                statusDiv.className = "mt-4 text-center font-semibold text-red-600";
                statusDiv.innerText = "❌ حدث خطأ في الاتصال بالسيرفر.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
