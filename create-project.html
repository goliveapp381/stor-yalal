<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء مشروع جديد | TemplateCraft Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .animated-mesh-bg {
      background: linear-gradient(-45deg, #0f172a, #2e1065, #4c1d95, #3b0764);
      background-size: 400% 400%;
      animation: waveGradient 12s ease infinite;
    }
    @keyframes waveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-purple-600">TemplateCraft Pro</h1>
      <a href="index.html" class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-4 py-2 rounded-xl text-sm font-bold transition">
        الرئيسية ➔
      </a>
    </div>
  </header>

  <!-- Wizard Main Container -->
  <main class="max-w-3xl mx-auto px-4 py-12 w-full flex-grow">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-bold text-gray-900">إنشاء مشروع جديد 🚀</h2>
        <p id="step-desc" class="text-gray-500 text-sm mt-1">الخطوة 1 من 2: معلومات المشروع وطريقة البناء</p>
      </div>

      <!-- Form Steps -->
      <form id="create-project-form" onsubmit="handleFinalSubmit(event)">
        
        <!-- ================= الخطوة الأولى: المعلومات واختيار طريقة البناء ================= -->
        <div id="step-1" class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">اسم المشروع (Site Name)</label>
            <input type="text" id="siteName" required class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50" placeholder="مثال: my-store-2026">
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">تصنيف المشروع</label>
            <select id="projectType" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50">
              <option value="ecommerce">متجر إلكتروني (E-commerce)</option>
              <option value="corporate">شركات وخدمات (Corporate)</option>
              <option value="restaurant">مطاعم وضيافة (Restaurant)</option>
              <option value="real-estate">عقارات (Real Estate)</option>
              <option value="blog">مدونات شخصية (Blog)</option>
            </select>
          </div>

          <!-- اختيار طريقة البناء -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-3">طريقة بناء المشروع</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              
              <label class="border-2 rounded-xl p-4 cursor-pointer hover:border-purple-600 flex items-center gap-3 transition">
                <input type="radio" name="buildMode" value="template" checked class="text-purple-600 focus:ring-purple-500">
                <div>
                  <span class="block font-bold text-gray-800">قوالب جاهزة من الموقع</span>
                  <span class="text-xs text-gray-500">اختر قالباً احترافياً من قوالبنا</span>
                </div>
              </label>

              <label class="border-2 rounded-xl p-4 cursor-pointer hover:border-purple-600 flex items-center gap-3 transition">
                <input type="radio" name="buildMode" value="code" class="text-purple-600 focus:ring-purple-500">
                <div>
                  <span class="block font-bold text-gray-800">ملف HTML / كود برمجي</span>
                  <span class="text-xs text-gray-500">ارفع ملفك أو اكتب الكود يدوياً</span>
                </div>
              </label>

            </div>
          </div>

          <button type="button" onclick="goToStep2()" class="w-full bg-gradient-to-r from-purple-700 via-indigo-600 to-blue-600 text-emerald-300 py-3.5 rounded-xl font-bold transition shadow-lg shadow-purple-900/20">
            التالي ➔
          </button>
        </div>


        <!-- ================= الخطوة الثانية: (تتغير حسب اختيار المستخدم في الخطوة 1) ================= -->
        <div id="step-2" class="space-y-6 hidden">
          
          <!-- القسم أ: القوالب الجاهزة -->
          <div id="templates-container" class="space-y-4 hidden">
            <h3 class="text-lg font-bold text-gray-800 border-r-4 border-purple-600 pr-3">اختر القالب المناسب لموقعك:</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <label class="cursor-pointer border-2 rounded-xl p-4 hover:border-purple-600 transition flex flex-col justify-between relative group">
                <input type="radio" name="selectedTemplate" value="store-demo" checked class="absolute top-3 left-3 text-purple-600">
                <div>
                  <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=400" alt="متجر" class="w-full h-32 object-cover rounded-lg mb-3">
                  <h4 class="font-bold text-gray-800 text-sm">قالب متجر ملابس عصري</h4>
                </div>
                <a href="./templates/store-demo/index.html" target="_blank" class="text-xs text-purple-600 mt-2 hover:underline inline-block">معاينة مباشرة ↗</a>
              </label>

              <label class="cursor-pointer border-2 rounded-xl p-4 hover:border-purple-600 transition flex flex-col justify-between relative group">
                <input type="radio" name="selectedTemplate" value="company-demo" class="absolute top-3 left-3 text-purple-600">
                <div>
                  <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=400" alt="شركة" class="w-full h-32 object-cover rounded-lg mb-3">
                  <h4 class="font-bold text-gray-800 text-sm">قالب شركة استشارات</h4>
                </div>
                <a href="./templates/company-demo/index.html" target="_blank" class="text-xs text-purple-600 mt-2 hover:underline inline-block">معاينة مباشرة ↗</a>
              </label>

              <label class="cursor-pointer border-2 rounded-xl p-4 hover:border-purple-600 transition flex flex-col justify-between relative group">
                <input type="radio" name="selectedTemplate" value="restaurant-demo" class="absolute top-3 left-3 text-purple-600">
                <div>
                  <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400" alt="مطعم" class="w-full h-32 object-cover rounded-lg mb-3">
                  <h4 class="font-bold text-gray-800 text-sm">قالب مطعم ومقاهي</h4>
                </div>
                <a href="./templates/restaurant-demo/index.html" target="_blank" class="text-xs text-purple-600 mt-2 hover:underline inline-block">معاينة مباشرة ↗</a>
              </label>
            </div>
          </div>

          <!-- القسم ب: رفع ملف HTML أو كود -->
          <div id="code-container" class="space-y-4 hidden">
            <h3 class="text-lg font-bold text-gray-800 border-r-4 border-purple-600 pr-3">رفع كود أو ملف HTML للمشروع:</h3>
            
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2">أدخل كود HTML الخاص بك يدوياً</label>
              <textarea id="htmlCode" rows="6" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-purple-600 bg-gray-50 font-mono text-sm" placeholder="<!DOCTYPE html>..."></textarea>
            </div>
          </div>

          <!-- أزرار التنقل -->
          <div class="flex gap-4 pt-4">
            <button type="button" onclick="goToStep1()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3.5 rounded-xl font-bold transition">
              ← السابق
            </button>
            <button type="submit" class="w-2/3 bg-gradient-to-r from-purple-700 via-indigo-600 to-blue-600 text-emerald-300 py-3.5 rounded-xl font-bold transition shadow-lg shadow-purple-900/20">
              إطلاق وحفظ المشروع 🚀
            </button>
          </div>

        </div>

      </form>

    </div>
  </main>

  <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
    جميع الحقوق محفوظة © 2026 - منصة TemplateCraft Pro
  </footer>

  <!-- استدعاء ملف الإنديكس المركزي -->
  <script src="./client-api.js"></script>
  <script>
    let chosenBuildMode = 'template';

    function goToStep2() {
      const siteName = document.getElementById('siteName').value;
      if (!siteName.trim()) {
        alert('⚠️ الرجاء إدخال اسم المشروع أولاً!');
        return;
      }

      chosenBuildMode = document.querySelector('input[name="buildMode"]:checked').value;
      
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');

      const templatesContainer = document.getElementById('templates-container');
      const codeContainer = document.getElementById('code-container');

      if (chosenBuildMode === 'template') {
        templatesContainer.classList.remove('hidden');
        codeContainer.classList.add('hidden');
        document.getElementById('step-desc').innerText = 'الخطوة 2 من 2: اختر القالب الجاهز المناسب';
      } else {
        templatesContainer.classList.add('hidden');
        codeContainer.classList.remove('hidden');
        document.getElementById('step-desc').innerText = 'الخطوة 2 من 2: رفع أو كتابة كود المشروع';
      }
    }

    function goToStep1() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
      document.getElementById('step-desc').innerText = 'الخطوة 1 من 2: معلومات المشروع وطريقة البناء';
    }

    async function handleFinalSubmit(event) {
      event.preventDefault();
      
      const storedUser = localStorage.getItem('user');
      if (!storedUser) {
        alert('❌ يجب تسجيل الدخول أولاً!');
        window.location.href = 'login.html';
        return;
      }
      const user = JSON.parse(storedUser);

      const siteName = document.getElementById('siteName').value;
      const projectType = document.getElementById('projectType').value;
      
      let templateId = 'custom-html';
      let htmlCodeVal = '';

      if (chosenBuildMode === 'template') {
        templateId = document.querySelector('input[name="selectedTemplate"]:checked').value;
      } else {
        htmlCodeVal = document.getElementById('htmlCode').value;
      }

      // إرسال البيانات للباكند
      const result = await TemplateCraftAPI.deploy({
        userId: user.id || user.username,
        siteName,
        templateId,
        variables: { projectType, sourceType: chosenBuildMode, htmlCode: htmlCodeVal }
      });

      if (result.success) {
        alert('✅ ' + result.message);
        window.location.href = 'profile.html';
      } else {
        alert('❌ خطأ: ' + result.error);
      }
    }
  </script>

</body>
</html>
