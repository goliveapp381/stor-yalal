<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | TemplateCraft Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }

        .project-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

<header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center gap-4">

        <div>
            <h1 class="text-xl font-bold text-purple-600">
                TemplateCraft Pro
            </h1>

            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-bold">
                لوحة التحكم
            </span>
        </div>

        <div class="flex items-center gap-3 flex-wrap">

            <span id="user-welcome" class="text-sm font-bold">
                مرحباً
            </span>

            <a
                href="create-project.html"
                class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-bold"
            >
                + مشروع جديد
            </a>

            <button
                id="logout-button"
                type="button"
                class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-xl text-sm font-bold"
            >
                خروج
            </button>

        </div>
    </div>
</header>


<main class="max-w-7xl mx-auto px-6 py-10 w-full">

    <div class="mb-8 flex justify-between items-center border-b pb-4 gap-3">

        <div>
            <h2 class="text-2xl font-bold text-gray-900">
                مشاريعي 🚀
            </h2>

            <p class="text-gray-500 text-sm mt-1">
                جميع المواقع المرتبطة بحسابك.
            </p>
        </div>

        <div class="flex items-center gap-3">

            <button
                id="refresh-projects"
                type="button"
                class="text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-xl text-sm font-bold"
            >
                ↻ تحديث
            </button>

            <a href="index.html" class="text-purple-600 text-sm font-bold">
                ← الرئيسية
            </a>

        </div>
    </div>


    <div
        id="sites-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    >
        <div class="col-span-full text-center py-16 text-gray-400">
            ⏳ جاري تحميل مشاريعك...
        </div>
    </div>

</main>


<footer class="bg-white border-t py-6 text-center text-gray-400 text-sm">
    جميع الحقوق محفوظة © 2026 - TemplateCraft Pro
</footer>


<script src="./client-api.js"></script>

<script>

    // ==========================================
    // 1. AUTHENTICATION CHECK
    // ==========================================

    function clearAuthentication() {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
    }

    const storedUser = localStorage.getItem('user');
    const authToken = localStorage.getItem('token');

    if (!storedUser || !authToken) {
        clearAuthentication();
        window.location.replace('login.html');
        throw new Error('Authentication required');
    }

    let user = null;

    try {
        user = JSON.parse(storedUser);

        if (!user || typeof user !== 'object') {
            throw new Error('بيانات المستخدم غير صالحة');
        }

    } catch (error) {
        clearAuthentication();
        window.location.replace('login.html');
        throw error;
    }


    // ==========================================
    // 2. USER INFORMATION
    // ==========================================

    const userWelcome = document.getElementById('user-welcome');

    userWelcome.textContent =
        `مرحباً، ${user.username || user.email || 'مستخدم'}`;


    // ==========================================
    // 3. HELPERS
    // ==========================================

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    function getUserId() {
        return user.id || user._id || null;
    }


    // ==========================================
    // 4. SAFE CUSTOM DOMAIN URL
    // ==========================================

    function getSafeProjectUrl(site) {

        if (!site || typeof site !== 'object') {
            return null;
        }

        if (site.domainStatus !== 'active') {
            return null;
        }

        if (
            !site.customUrl ||
            typeof site.customUrl !== 'string'
        ) {
            return null;
        }

        try {
            const parsed = new URL(site.customUrl);

            if (parsed.protocol !== 'https:') {
                return null;
            }

            const hostname = parsed.hostname.toLowerCase();

            if (
                !hostname.endsWith('.gollivetv.com') ||
                hostname === 'gollivetv.com'
            ) {
                return null;
            }

            return parsed.href;

        } catch (error) {
            return null;
        }
    }


    // ==========================================
    // 5. DOMAIN STATUS DISPLAY
    // ==========================================

    function getDomainStatus(site, projectUrl) {

        if (projectUrl) {
            return {
                label: 'الدومين جاهز',
                description: 'موقعك متاح الآن عبر الدومين الخاص.',
                style: 'bg-green-50 text-green-700 border-green-200',
                icon: '✅'
            };
        }

        if (
            site.domainStatus === 'failed' ||
            site.domainStatus === 'error'
        ) {
            return {
                label: 'تعذر تجهيز الدومين',
                description: 'حدث مشكل أثناء إعداد الدومين. حاول تحديث الحالة.',
                style: 'bg-red-50 text-red-700 border-red-200',
                icon: '⚠️'
            };
        }

        if (
            site.domainStatus === 'active' &&
            !projectUrl
        ) {
            return {
                label: 'الرابط غير متاح',
                description: 'تعذر التحقق من رابط الدومين.',
                style: 'bg-yellow-50 text-yellow-700 border-yellow-200',
                icon: '⚠️'
            };
        }

        return {
            label: 'جاري تجهيز الدومين',
            description: 'يتم إعداد DNS وشهادة SSL. سيظهر الرابط عند اكتمال العملية.',
            style: 'bg-yellow-50 text-yellow-700 border-yellow-200',
            icon: '⏳'
        };
    }


    // ==========================================
    // 6. AUTHENTICATION ERROR HANDLER
    // ==========================================

    function handleAuthenticationError(result) {

        if (
            result &&
            (
                result.status === 401 ||
                result.status === 403
            )
        ) {
            clearAuthentication();
            window.location.replace('login.html');
            return true;
        }

        return false;
    }


    // ==========================================
    // 7. LOAD USER PROJECTS
    // ==========================================

    async function loadUserSites() {

        const grid = document.getElementById('sites-grid');

        grid.innerHTML = `
            <div class="col-span-full text-center py-16 text-gray-400">
                ⏳ جاري تحميل مشاريعك...
            </div>
        `;

        const userId = getUserId();

        if (!userId) {
            grid.innerHTML = `
                <div class="col-span-full bg-white p-10 rounded-2xl border text-center">
                    <p class="text-red-500 font-bold">
                        ❌ معرف المستخدم غير موجود.
                    </p>

                    <p class="text-gray-500 text-sm mt-2">
                        يرجى تسجيل الخروج ثم تسجيل الدخول مجدداً.
                    </p>
                </div>
            `;
            return;
        }

        if (
            typeof TemplateCraftAPI === 'undefined' ||
            typeof TemplateCraftAPI.getSites !== 'function'
        ) {
            grid.innerHTML = `
                <div class="col-span-full bg-white p-10 rounded-2xl border text-center">
                    <p class="text-red-500 font-bold">
                        ❌ تعذر تحميل نظام الاتصال بالخادم.
                    </p>

                    <p class="text-gray-500 text-sm mt-2">
                        تأكد من ملف client-api.js.
                    </p>
                </div>
            `;
            return;
        }

        try {

            const result = await TemplateCraftAPI.getSites(userId);

            if (handleAuthenticationError(result)) {
                return;
            }

            if (!result || !result.success) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white p-10 rounded-2xl border text-center">

                        <p class="text-red-500 font-bold mb-3">
                            ❌ ${escapeHtml(result?.error || 'تعذر جلب المشاريع')}
                        </p>

                        <button
                            type="button"
                            onclick="loadUserSites()"
                            class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl"
                        >
                            إعادة المحاولة
                        </button>

                    </div>
                `;
                return;
            }

            if (!Array.isArray(result.sites) || result.sites.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-2xl border text-center">

                        <p class="text-gray-500 font-semibold mb-4">
                            ليس لديك أي مشروع حتى الآن.
                        </p>

                        <a
                            href="create-project.html"
                            class="inline-block bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-bold"
                        >
                            إنشاء أول مشروع 🚀
                        </a>

                    </div>
                `;
                return;
            }

            grid.innerHTML = '';

            // ==========================================
            // CREATE PROJECT CARDS
            // ==========================================

            result.sites.forEach(site => {

                const siteId = site._id || site.id;

                const projectName =
                    site.variables?.displayName ||
                    site.siteName ||
                    'مشروع بدون اسم';

                const projectType =
                    site.variables?.projectType ||
                    'غير محدد';

                const templateId =
                    site.templateId ||
                    'غير محدد';

                const date = site.createdAt
                    ? new Date(site.createdAt).toLocaleDateString('ar-MA')
                    : '-';

                const projectUrl = getSafeProjectUrl(site);

                const domainStatus = getDomainStatus(
                    site,
                    projectUrl
                );

                const editorUrl = siteId
                    ? `editor.html?siteId=${encodeURIComponent(siteId)}`
                    : null;

                const card = document.createElement('div');

                card.className =
                    'project-card bg-white p-6 rounded-2xl border shadow-sm hover:shadow-md flex flex-col justify-between';

                card.innerHTML = `

                    <div>

                        <div class="flex justify-between items-start gap-3 mb-4">

                            <h3 class="font-bold text-lg text-gray-900 break-words">
                                ${escapeHtml(projectName)}
                            </h3>

                            <span class="text-xs bg-purple-50 text-purple-700 px-2.5 py-1 rounded-md font-bold whitespace-nowrap">
                                ${escapeHtml(templateId)}
                            </span>

                        </div>

                        <div class="text-sm text-gray-500 mb-2">
                            الصنف:
                            <strong class="text-gray-700">
                                ${escapeHtml(projectType)}
                            </strong>
                        </div>

                        <div class="text-xs text-gray-400 mb-4">
                            تاريخ الإنشاء:
                            ${escapeHtml(date)}
                        </div>

                        <div class="border rounded-xl p-3 mb-4 ${domainStatus.style}">

                            <div class="font-bold text-sm mb-1">
                                ${domainStatus.icon}
                                ${escapeHtml(domainStatus.label)}
                            </div>

                            <p class="text-xs">
                                ${escapeHtml(domainStatus.description)}
                            </p>

                        </div>

                        <div
                            class="bg-gray-50 p-3 rounded-xl border text-xs text-gray-600 font-mono truncate mb-5"
                            dir="ltr"
                            title="${escapeAttribute(projectUrl || 'الدومين قيد التجهيز')}"
                        >
                            ${
                                projectUrl
                                ? escapeHtml(projectUrl)
                                : 'الدومين الخاص قيد التجهيز...'
                            }
                        </div>

                    </div>

                    <div class="grid grid-cols-2 gap-2">

                        ${
                            editorUrl
                            ? `
                                <a
                                    href="${escapeAttribute(editorUrl)}"
                                    class="col-span-2 block text-center bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl text-sm font-bold transition"
                                >
                                    ✏️ تعديل المشروع
                                </a>
                            `
                            : `
                                <button
                                    disabled
                                    class="col-span-2 bg-gray-200 text-gray-400 py-2.5 rounded-xl text-sm font-bold cursor-not-allowed"
                                >
                                    ✏️ التعديل غير متاح
                                </button>
                            `
                        }

                        ${
                            projectUrl
                            ? `
                                <a
                                    href="${escapeAttribute(projectUrl)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="block text-center bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-bold transition"
                                >
                                    👁️ معاينة
                                </a>
                            `
                            : `
                                <button
                                    disabled
                                    class="bg-gray-100 text-gray-400 py-2.5 rounded-xl text-sm font-bold cursor-not-allowed"
                                    title="سيصبح متاحاً بعد تجهيز الدومين"
                                >
                                    👁️ غير متاح
                                </button>
                            `
                        }

                        <button
                            type="button"
                            class="copy-project-link bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-bold transition ${!projectUrl ? 'opacity-50 cursor-not-allowed' : ''}"
                            data-url="${escapeAttribute(projectUrl || '')}"
                            ${!projectUrl ? 'disabled' : ''}
                        >
                            📋 نسخ الرابط
                        </button>

                    </div>
                `;

                grid.appendChild(card);
            });


            // ==========================================
            // COPY PROJECT URL
            // ==========================================

            grid.querySelectorAll('.copy-project-link').forEach(button => {

                button.addEventListener('click', async () => {

                    const url = button.dataset.url;

                    if (!url) {
                        alert('الدومين الخاص بالمشروع مازال قيد التجهيز.');
                        return;
                    }

                    try {
                        await navigator.clipboard.writeText(url);

                        const oldText = button.textContent;
                        button.textContent = '✅ تم النسخ';

                        setTimeout(() => {
                            button.textContent = oldText;
                        }, 2000);

                    } catch (error) {
                        alert('تعذر نسخ الرابط. يمكنك نسخه يدوياً.');
                    }
                });
            });

        } catch (error) {

            console.error('Load projects error:', error);

            grid.innerHTML = `
                <div class="col-span-full bg-white p-10 rounded-2xl border text-center">

                    <p class="text-red-500 font-bold mb-3">
                        ❌ حدث خطأ أثناء تحميل المشاريع.
                    </p>

                    <button
                        type="button"
                        onclick="loadUserSites()"
                        class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl"
                    >
                        إعادة المحاولة
                    </button>

                </div>
            `;
        }
    }


    // ==========================================
    // 8. LOGOUT
    // ==========================================

    document
        .getElementById('logout-button')
        .addEventListener('click', () => {

            clearAuthentication();

            window.location.replace('login.html');
        });


    // ==========================================
    // 9. REFRESH PROJECTS
    // ==========================================

    document
        .getElementById('refresh-projects')
        .addEventListener('click', () => {
            loadUserSites();
        });


    // ==========================================
    // 10. START
    // ==========================================

    loadUserSites();

</script>

</body>
</html>
