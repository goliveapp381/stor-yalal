<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سريع للخدمات اللوجستية والشحن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-cyan-50/20 text-gray-800">
  <header class="bg-white border-b py-4">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-cyan-700">سريع لوجستيك 🚚</h1>
      <button class="bg-cyan-600 text-white px-5 py-2 rounded-xl text-sm font-bold">تتبع شحنتك</button>
    </div>
  </header>
  <section class="max-w-6xl mx-auto px-4 py-20 text-center">
    <h2 class="text-4xl font-bold text-gray-900">نقل بضائعك بأمان وسرعة فائقة حول العالم</h2>
    <p class="text-gray-600 mt-4 max-w-xl mx-auto">خدمات شحن بري، بحري، وجوي متكاملة تلبي احتياجات عملك بدقة.</p>
  </section>
</body>
</html>
