<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدونة رؤية للتصميم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100">
  <header class="py-8 border-b border-zinc-800 text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-400">DESIGN VISION</h1>
    <p class="text-zinc-400 text-sm mt-2">مقالات في تصميم الواجهات والمفهوم البصري</p>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="border border-zinc-800 rounded-2xl p-6 bg-zinc-900/50">
        <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=500" class="w-full h-48 object-cover rounded-xl mb-4">
        <span class="text-xs text-rose-400 font-semibold">UI/UX Design</span>
        <h3 class="text-xl font-bold mt-1">قواعد التناسق البصري وترتيب العناصر</h3>
        <p class="text-zinc-400 text-sm mt-2">كيف تجعل تصميم واجهة موقعك مريحاً ومبهراً في نفس الوقت.</p>
      </div>
      <div class="border border-zinc-800 rounded-2xl p-6 bg-zinc-900/50">
        <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500" class="w-full h-48 object-cover rounded-xl mb-4">
        <span class="text-xs text-pink-400 font-semibold">Color Theory</span>
        <h3 class="text-xl font-bold mt-1">تنسيق الألوان وتأثيرها النفسي على المستخدم</h3>
        <p class="text-zinc-400 text-sm mt-2">دليل توظيف التدرجات اللونية لإبراز الهية البصرية.</p>
      </div>
    </div>
  </main>
</body>
</html>
