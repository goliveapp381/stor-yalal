<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدونة المستثمر الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">
  <header class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold">$</div>
      <h1 class="text-xl font-bold">المستثمر الذكي</h1>
    </div>
    <span class="text-xs bg-slate-800 text-blue-400 px-3 py-1.5 rounded border border-slate-700">تحليلات اقتصادية</span>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-8 items-center">
      <img src="https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?w=600" class="w-full md:w-1/2 h-64 rounded-xl object-cover">
      <div>
        <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">تقرير خاص</span>
        <h2 class="text-2xl font-bold text-slate-900 mt-2 mb-3">أساسيات إدارة التمويل الشخصي والادخار</h2>
        <p class="text-slate-600 text-sm mb-4 leading-relaxed">استراتيجيات عمل بنّاءة لتنظيم الميزانية الشهرية واستثمار الفائض بشكل آمن ومستدام.</p>
        <button class="bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-lg hover:bg-blue-600 transition">اقرأ التقرير كامل</button>
      </div>
    </div>
  </main>
</body>
</html>
